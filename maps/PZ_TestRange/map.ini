;==============================================================================
; PZ Test Range - map-scoped overrides (loaded by the engine as INI_LOAD_CREATE_OVERRIDES).
; Original. Effects while this map is played: the stock USA and China command
; centers gain "Build Kestrel" (empty slot 11) and their builders gain
; "Build Field Depot" (empty slots: USA dozer 12, China dozer 13).
; This is the B1 prototype hook into the licensed base game; B2 replaces it with
; the project's own command center and faction templates.
;==============================================================================

CommandSet AmericaCommandCenterCommandSet
  11 = PZDev_Command_ConstructKestrel
End

CommandSet ChinaCommandCenterCommandSet
  11 = PZDev_Command_ConstructKestrel
End

CommandSet AmericaDozerCommandSet
  12 = PZDev_Command_ConstructFieldDepot
End

CommandSet ChinaDozerCommandSet
  13 = PZDev_Command_ConstructFieldDepot
End
