;==============================================================================
; Steel Accord - DEV content, B1.1
; Original definitions authored for this project. Not EA data.
; Kestrel: light wheeled scout with a pintle chain gun. Faction-neutral test unit.
; Side = America is a B1 prototype binding only (lets the USA command center build it
; on the PZ Test Range map). B2 rebinds it to the project's own faction templates.
;==============================================================================

Object PZDevKestrel

  ; --- art
  SelectPortrait  = PZDevKestrelPortrait
  ButtonImage     = PZDevKestrelButton

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = PZKESTREL
    End
  End

  ; --- design
  DisplayName      = OBJECT:PZDevKestrel
  Side             = America
  EditorSorting    = VEHICLE
  TransportSlotCount = 2

  WeaponSet
    Conditions = None
    Weapon     = PRIMARY PZDevKestrelChainGun
  End
  ArmorSet
    Conditions = None
    Armor      = PZDevArmorLightVehicle
  End

  BuildCost           = 450
  BuildTime           = 5.0
  VisionRange         = 220
  ShroudClearingRange = 360
  ExperienceValue     = 40 40 80 120
  ExperienceRequired  = 0 80 160 320
  IsTrainable         = Yes
  CrusherLevel        = 1
  CrushableLevel      = 2
  CommandSet          = PZDevKestrelCommandSet

  RadarPriority = UNIT
  KindOf        = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT VEHICLE SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth     = 240.0
    InitialHealth = 240.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor = SET_NORMAL PZDevKestrelLocomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 40.0
  End

  Behavior = FXListDie ModuleTag_05
    DeathFX = PZDevFX_KestrelDestroyed
  End
  Behavior = CreateObjectDie ModuleTag_06
    CreationList = PZDevOCL_KestrelWreck
  End
  Behavior = DestroyDie ModuleTag_07
  End

  Geometry            = BOX
  GeometryMajorRadius = 11.0
  GeometryMinorRadius = 5.5
  GeometryHeight      = 9.0
  GeometryIsSmall     = Yes
End

;------------------------------------------------------------------------------
; Wreck left behind for 12 seconds after destruction (original burnt model).
Object PZDevKestrelWreck
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = PZKESTRELHK
    End
  End
  DisplayName   = OBJECT:PZDevKestrelWreck
  EditorSorting = SYSTEM
  KindOf        = IMMOBILE NO_COLLIDE HULK
  Body = ActiveBody ModuleTag_02
    MaxHealth     = 100.0
    InitialHealth = 100.0
  End
  Behavior = LifetimeUpdate ModuleTag_03
    MinLifetime = 12000
    MaxLifetime = 12000
  End
  Behavior = DestroyDie ModuleTag_04
  End
  Geometry            = BOX
  GeometryMajorRadius = 11.0
  GeometryMinorRadius = 5.5
  GeometryHeight      = 7.0
  GeometryIsSmall     = Yes
End

;------------------------------------------------------------------------------
; Engine-drawn tracer line used by the Kestrel's gun FX (no texture).
Object PZDevTracer
  KindOf        = DRAWABLE_ONLY
  EditorSorting = SYSTEM
  Draw = W3DTracerDraw ModuleTag_01
  End
End
