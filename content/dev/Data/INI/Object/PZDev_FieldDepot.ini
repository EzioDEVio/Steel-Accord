;==============================================================================
; Steel Accord - DEV content, B1 (original definitions)
; Field Depot: prefab forward vehicle depot. Built by a builder (dozer), consumes
; 1 power, produces the Kestrel. Side = America is the B1 prototype binding only.
;==============================================================================

Object PZDevFieldDepot

  SelectPortrait = PZDevFieldDepotPortrait
  ButtonImage    = PZDevFieldDepotButton

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = PZFIELDDEPOT
    End
    ConditionState = REALLYDAMAGED
      Model = PZFIELDDEPOTD
    End
    ConditionState = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
      Model = PZFIELDDEPOT
      Flags = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
    End
    ConditionState = SOLD
      Model = NONE
    End
  End

  DisplayName      = OBJECT:PZDevFieldDepot
  Side             = America
  EditorSorting    = STRUCTURE
  BuildCost        = 800
  BuildTime        = 12.0
  EnergyProduction = -1
  CommandSet       = PZDevFieldDepotCommandSet
  VisionRange      = 200.0
  ShroudClearingRange = 220
  ArmorSet
    Conditions = None
    Armor      = PZDevArmorStructure
  End
  ExperienceValue = 100 100 100 100

  RadarPriority = STRUCTURE
  KindOf        = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY

  Body = StructureBody ModuleTag_02
    MaxHealth     = 1400.0
    InitialHealth = 1400.0
  End
  Behavior = ProductionUpdate ModuleTag_03
    ConstructionCompleteDuration = 500
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_04
    UnitCreatePoint   = X: 18.0 Y: 0.0 Z: 0.0
    NaturalRallyPoint = X: 50.0 Y: 0.0 Z: 0.0
  End
  Behavior = FXListDie ModuleTag_05
    DeathFX = PZDevFX_DepotDestroyed
  End
  Behavior = CreateObjectDie ModuleTag_06
    CreationList = PZDevOCL_DepotRubble
    ExemptStatus = UNDER_CONSTRUCTION
  End
  Behavior = DestroyDie ModuleTag_07
  End

  Geometry            = BOX
  GeometryMajorRadius = 30.0
  GeometryMinorRadius = 26.0
  GeometryHeight      = 22.0
  GeometryIsSmall     = No
  FactoryExitWidth    = 20
  BuildCompletion     = PLACED_BY_PLAYER
End

;------------------------------------------------------------------------------
Object PZDevDepotRubble
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = PZDEPOTRUBBLE
    End
  End
  DisplayName   = OBJECT:PZDevDepotRubble
  EditorSorting = SYSTEM
  KindOf        = IMMOBILE NO_COLLIDE HULK
  Body = ActiveBody ModuleTag_02
    MaxHealth     = 100.0
    InitialHealth = 100.0
  End
  Behavior = LifetimeUpdate ModuleTag_03
    MinLifetime = 20000
    MaxLifetime = 20000
  End
  Behavior = DestroyDie ModuleTag_04
  End
  Geometry            = BOX
  GeometryMajorRadius = 30.0
  GeometryMinorRadius = 26.0
  GeometryHeight      = 4.0
  GeometryIsSmall     = No
End
